<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFill</title>
  <link rel="stylesheet" href="./src/popup/popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </span>
        <div>
          <h1>SmartFill</h1>
          <p class="subtitle">Job application autofill</p>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <label class="field">
      <span class="field-label">Profile</span>
      <select id="profileSelect"></select>
    </label>

    <button id="fillProfileBtn" class="btn btn-primary">Fill with my profile</button>
    <button id="fillDummyBtn" class="btn btn-secondary">Fill with dummy data</button>

    <div class="row">
      <button id="undoBtn" class="btn btn-ghost">Undo</button>
      <button id="clearBtn" class="btn btn-ghost">Clear</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <details id="reportDetails" class="report" hidden>
      <summary>Fill details</summary>
      <ul id="reportList"></ul>
    </details>

    <p class="hint">Résumé uploads must be attached manually — SmartFill highlights the field for you.</p>
  </div>

  <script type="module" src="./src/popup/popup.ts"></script>
</body>
</html>
